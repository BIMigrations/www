<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#F1EEE6;color:#0A0C10;font-family:Archivo,Helvetica,sans-serif;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(45% 75% at 88% 25%,rgba(11,127,107,.26),transparent 70%),radial-gradient(40% 70% at 0% 100%,rgba(199,104,27,.22),transparent 70%)}
.rings{position:absolute;inset:0;background:repeating-radial-gradient(circle at 86% 32%,rgba(10,12,16,.16) 0 1px,transparent 1px 48px);-webkit-mask-image:radial-gradient(42% 70% at 86% 32%,#000 15%,transparent 70%)}
.dot{position:absolute;left:calc(86% - 9px);top:calc(32% - 9px);width:18px;height:18px;border-radius:99px;background:#0B7F6B;box-shadow:0 0 0 18px rgba(11,127,107,.14),0 0 0 38px rgba(11,127,107,.06)}
.in{position:absolute;inset:60px 72px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;font-size:21px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.brand i{font-style:normal;color:#5F6570;font-weight:400;margin:0 6px}
.kick{display:flex;align-items:center;gap:14px;font-size:19px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#3A3D44;margin-bottom:22px}
.kick b{width:10px;height:10px;border-radius:99px;background:#C7681B;display:block}
h1{font-size:76px;line-height:1.02;letter-spacing:-.04em;font-weight:700;max-width:16ch}
h1 em{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-style:italic;color:#0B7F6B;letter-spacing:-.02em}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:21px;color:#3A3D44}
.foot b{font-weight:600;color:#0A0C10}
</style></head><body>
<div class="glow"></div><div class="rings"></div><div class="dot"></div>
<div class="in">
  <div class="brand"><svg width="32" height="32" viewBox="0 0 72 72"><polygon points="36,6 64,21 36,36 8,21" fill="#0A0C10"/><polygon points="8,21 36,36 36,66 8,51" fill="#C7681B"/><polygon points="36,36 64,21 64,51 36,66" fill="#0B7F6B"/></svg>BI<i>/</i>Migrations</div>
  <div><div class="kick"><b></b><span id="kicker">Insights</span></div><h1 id="title"></h1></div>
  <div class="foot"><span id="byline"></span><span>bimigrations.com</span></div>
</div>
<script>
var q=new URLSearchParams(location.search);
document.getElementById('kicker').textContent=q.get('kicker')||'Insights';
document.getElementById('byline').innerHTML=q.get('byline')||'';
var t=q.get('title')||'';
document.getElementById('title').innerHTML=t;
var h=document.querySelector('h1'), size=76;
while(h.scrollHeight>300 && size>44){ size-=4; h.style.fontSize=size+'px'; }
</script></body></html>
